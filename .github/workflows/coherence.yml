name: Verificar coerencia do game
on:
  push:
    branches: [main]
  pull_request:
jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe de todos os módulos
        run: |
          for f in js/*.js js/*.mjs tests/*.mjs; do node --check "$f"; done
      - run: node --test tests/*.test.mjs
